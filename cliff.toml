[changelog]
# Stripped in CI (`--strip header`) so the release body stays header-free;
# kept when generating the committed CHANGELOG.md locally.
header = """
# Changelog

"""
body = """
{% if version %}## {{ version }}{% if timestamp %} ({{ timestamp | date(format="%Y-%m-%d") }}){% endif %}{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {{ commit.message | upper_first }}
{% endfor %}
{% endfor %}\
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
tag_pattern = "^v[0-9]+\\."
skip_tags = "^(Alpha|PRE-BETA)"
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^ci", group = "CI/CD" },
  { message = "^chore", group = "Chores" },
  { message = "^docs", group = "Documentation" },
  { message = "^test", group = "Testing" },
]
filter_commits = true
sort_commits = "newest"
