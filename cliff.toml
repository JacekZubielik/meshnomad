[changelog]
# Stripped in CI (`--strip header`) so the release body stays header-free;
# kept when generating the committed CHANGELOG.md locally.
header = """
# Changelog

"""
body = """
{% if version %}## {{ version }}{% if timestamp %} ({{ timestamp | date(format="%Y-%m-%d") }}){% endif %}{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {{ commit.message | upper_first }}
{% endfor %}
{% endfor %}\
"""
trim = true

[git]
conventional_commits = true
# false (2026-08-23, was true): a squash-merge commit whose PR title lacked
# a conventional-commit prefix (e.g. "Settings overhaul: ..." for #100)
# silently vanished from release notes under the old `true` setting —
# v0.11.0 shipped a GitHub Release body missing its two largest PRs (#98,
# #100) until caught and hand-corrected. The catch-all parser below now
# nets anything without a recognized prefix into "Other Changes" instead,
# so a missing prefix degrades the changelog's grouping, not its content.
filter_unconventional = false
tag_pattern = "^v[0-9]+\\."
skip_tags = "^(Alpha|PRE-BETA)"
commit_parsers = [
  # Never surface internal AI-tooling references (CLAUDE.md, Claude Code) in
  # public release notes.
  { message = "(?i)claude", skip = true },
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^ci", group = "CI/CD" },
  { message = "^chore", group = "Chores" },
  { message = "^docs", group = "Documentation" },
  { message = "^test", group = "Testing" },
  # Catch-all: PR titles are still expected to carry a conventional-commit
  # prefix, but a missed one lands here instead of disappearing.
  { message = ".*", group = "Other Changes" },
]
filter_commits = true
sort_commits = "newest"
