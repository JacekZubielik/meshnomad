name: Flutter and Dart

on:
  pull_request:
    paths-ignore:
      - 'documentation/**'
      - 'docs/**'
      - '**.md'
  push:
    branches:
      - main
    paths-ignore:
      - 'documentation/**'
      - 'docs/**'
      - '**.md'

env:
  # Pin the Flutter toolchain so CI matches local fvm dev exactly and can't
  # drift day-to-day off `channel: stable` (per flutter-cicd-meshcore skill).
  FLUTTER_VERSION: "3.44.9"

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Run tests
        run: flutter test -r github
