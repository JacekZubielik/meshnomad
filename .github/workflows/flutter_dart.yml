name: Flutter and Dart

env:
  # Pin the Flutter toolchain so CI matches local fvm dev exactly and can't
  # drift day-to-day off `channel: stable` (per flutter-cicd-meshcore skill).
  FLUTTER_VERSION: "3.44.9"

on:
  # No `push: branches: [main]` on purpose: every commit that lands on main
  # already ran this exact analyze+test job on its pull_request check (or,
  # for a fast-forward promotion, on dev-custom's own PR) — repeating it
  # right after landing on main re-tests an already-known-green commit for
  # no benefit, just Actions minutes.
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Run tests
        run: flutter test -r github
