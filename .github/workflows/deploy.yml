name: Deploy to Cloudflare Workers

env:
  # Pin the Flutter toolchain so CI matches local fvm dev exactly and can't
  # drift day-to-day off `channel: stable` (per flutter-cicd-meshcore skill).
  FLUTTER_VERSION: "3.44.9"

# Tag trigger intentionally removed: Cloudflare secrets are not configured yet
# (deferred by owner, 2026-08-21) and every tag push produced a failing run.
# Restore `push: tags: ['v*']` here once CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID secrets exist.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Get dependencies
        run: flutter pub get

      - name: Build Web
        run: bun run build

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
