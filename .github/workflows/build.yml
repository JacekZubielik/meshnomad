name: Build

env:
  # Pin the Flutter toolchain so CI matches local fvm dev exactly and can't
  # drift day-to-day off `channel: stable` (per flutter-cicd-meshcore skill).
  FLUTTER_VERSION: "3.44.9"

on:
  push:
    # No `branches: [main]` here on purpose: main only ever receives commits
    # that already passed this exact workflow on their pull_request run (or,
    # for a plain fast-forward promotion from dev-custom, on dev-custom's own
    # PRs) — re-running it again right after landing on main just burns
    # Actions minutes on an already-known-green build. The tag trigger below
    # is the one that matters for a release; use workflow_dispatch (any
    # branch/ref) for an ad hoc signed build outside of a tagged release.
    tags:
      - 'v*'
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        # ubuntu-latest ran out of disk mid-build (NDK 27 + Gradle + Flutter
        # caches exceed the ~14GB default free space) - drop preinstalled
        # toolchains this build never touches. The NDK version we need is
        # downloaded fresh by the build regardless, so removing preinstalled
        # NDKs here is safe.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true
      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/build.gradle', 'android/settings.gradle', 'android/app/build.gradle', 'pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - run: flutter pub get
      # No --no-pub here: `flutter pub get` regenerates GeneratedPluginRegistrant
      # with ALL plugins (including dev-dependency integration_test), while the
      # release build excludes dev-dependency plugins from the compile classpath.
      # `flutter build` without --no-pub regenerates the registrant release-aware,
      # so the stale reference doesn't break :app:compileReleaseJavaWithJavac.
      - run: flutter build apk --release

  # Split into one job per artifact (APK, AAB) instead of building both
  # back-to-back in a single job: on ubuntu-latest's ~14GB disk / 7GB RAM,
  # a split-per-abi APK build followed immediately by an App Bundle build
  # in the same Gradle daemon/workspace was getting silently killed by the
  # runner ("The operation was canceled" after ~3min on the App Bundle step,
  # with no useful log — a resource-exhaustion symptom, not a build error).
  # Each job below gets its own fresh runner, so a crash in one no longer
  # wastes the other's already-successful build, and peak disk/memory per
  # job is roughly halved.
  android-release-apk:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: android
    steps:
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true
      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-apk-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/build.gradle', 'android/settings.gradle', 'android/app/build.gradle', 'pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-apk-
      - name: Decode keystore and write key.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/meshnomad-release.keystore
          cat > android/key.properties << EOF
          storeFile=meshnomad-release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
      - run: flutter pub get
      - name: Build release APKs (per-ABI)
        # Per-ABI split instead of one fat multi-arch APK: each device only
        # needs one of these, so the download is a fraction of the combined
        # size. The AAB is built separately below in its own job.
        run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v7
        with:
          name: meshnomad-release-apk
          path: build/app/outputs/flutter-apk/app-*-release.apk
          retention-days: 30

  android-release-aab:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: android
    steps:
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true
      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-aab-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/build.gradle', 'android/settings.gradle', 'android/app/build.gradle', 'pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-aab-
      - name: Decode keystore and write key.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/meshnomad-release.keystore
          cat > android/key.properties << EOF
          storeFile=meshnomad-release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
      - run: flutter pub get
      - name: Build release App Bundle
        run: flutter build appbundle --release
      - uses: actions/upload-artifact@v7
        with:
          name: meshnomad-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  android-release-publish:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [android-release-apk, android-release-aab]
    permissions:
      # The default GITHUB_TOKEN is read-only; creating the GitHub Release
      # (softprops/action-gh-release) needs contents write.
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # git-cliff needs the full history and tags to build release notes;
          # a shallow clone yields an empty changelog.
          fetch-depth: 0
      - uses: actions/download-artifact@v6
        with:
          name: meshnomad-release-apk
          path: build/app/outputs/flutter-apk
      - uses: actions/download-artifact@v6
        with:
          name: meshnomad-release-aab
          path: build/app/outputs/bundle/release
      - name: Determine changelog range
        if: startsWith(github.ref, 'refs/tags/v')
        id: range
        run: |
          # Previous v* tag if any; for the very first release fall back to the
          # fork merge-base with upstream (2026-07-28) so upstream history is
          # excluded from the notes.
          PREV=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          if [ -z "$PREV" ]; then
            PREV=98f6cf37455168466b5d973b94c74a8d8b0f624c
          fi
          echo "range=${PREV}..HEAD" >> "$GITHUB_OUTPUT"
          echo "Changelog range: ${PREV}..HEAD"
      - name: Generate changelog
        if: startsWith(github.ref, 'refs/tags/v')
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
          args: --strip header ${{ steps.range.outputs.range }}
        env:
          OUTPUT: CHANGES.md
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-*-release.apk
            build/app/outputs/bundle/release/app-release.aab
          body: ${{ steps.git-cliff.outputs.content }}

  ios:
    # Temporarily disabled 2026-08-21 to save Actions minutes on the free
    # plan (macos-latest runners bill at a 10x multiplier). Re-enable by
    # removing this `if:` line.
    if: false
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign --no-pub

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true
      - name: Install Linux build deps
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev
      - run: flutter pub get
      - run: flutter build linux --release --no-pub

  macos:
    # Temporarily disabled 2026-08-21 to save Actions minutes on the free
    # plan (macos-latest runners bill at a 10x multiplier). Re-enable by
    # removing this `if:` line.
    if: false
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true
      - name: Install macOS build deps
        run: brew install automake libtool
      - run: flutter pub get
      - run: flutter build macos --release --no-pub

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --no-pub
