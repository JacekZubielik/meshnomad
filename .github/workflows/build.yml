name: Build

env:
  # Pin the Flutter toolchain so CI matches local fvm dev exactly and can't
  # drift day-to-day off `channel: stable` (per flutter-cicd-meshcore skill).
  FLUTTER_VERSION: "3.44.9"

on:
  push:
    # No branch triggers and no pull_request trigger on purpose (owner
    # decision 2026-08-21, private-repo Actions minutes are the scarce
    # resource): validation before a PR is the local pre-push gate
    # (analyze+format+test) plus a device build, and flutter_dart.yml still
    # runs the cheap analyze+test on every PR. Full platform builds are
    # manual — trigger workflow_dispatch when artifacts are actually needed.
    # The tag trigger below is what produces a release.
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_aab:
        description: >-
          Also build the Play Store App Bundle (disabled by default: no Play
          Store presence yet, and the AAB build currently dies on the 7GB
          ubuntu-latest runner — see android-release-aab comment).
        type: boolean
        default: false

jobs:
  # No plain unsigned-fat-APK smoke job anymore: every run of this workflow
  # (tag or manual dispatch) builds the signed per-ABI APKs below, which is a
  # strictly better artifact from the same minutes. linux/web stay as the
  # only desktop/web coverage and now upload what they build.

  # One job per artifact (APK, AAB): the AAB build dies on ubuntu-latest even
  # alone on a fresh runner (hangs ~17min on `flutter build appbundle`, then
  # "The operation was canceled" with no error — the 229MB bundle with
  # llamadart native libs exhausts the 7GB runner). Keeping the jobs separate
  # means an AAB crash can never take the APKs down with it.
  # No `needs: android` — that job is a plain unsigned fat-APK smoke build,
  # and this job compiles everything itself anyway; chaining them would just
  # double the Android minutes per release.
  android-release-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true
      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-apk-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/build.gradle', 'android/settings.gradle', 'android/app/build.gradle', 'pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-apk-
      - name: Decode keystore and write key.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/meshnomad-release.keystore
          cat > android/key.properties << EOF
          storeFile=meshnomad-release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
      - run: flutter pub get
      - name: Build release APKs (per-ABI)
        # Per-ABI split instead of one fat multi-arch APK: each device only
        # needs one of these, so the download is a fraction of the combined
        # size. The AAB is built separately below in its own job.
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define=GIT_SHA=${GITHUB_SHA::8} \
            --dart-define=GIT_BRANCH=${GITHUB_REF_NAME} \
            --dart-define=GIT_DIRTY=false \
            --dart-define=BUILD_TIME=$(date -u +%Y-%m-%dT%H:%MZ) \
            --dart-define=BUILD_SOURCE=ci
      - uses: actions/upload-artifact@v7
        with:
          name: meshnomad-release-apk
          path: build/app/outputs/flutter-apk/app-*-release.apk
          retention-days: 30

  android-release-aab:
    # Disabled by default until further notice (owner decision 2026-08-21):
    # there is no Play Store presence yet, so the AAB has no consumer — and
    # this exact build is the one that keeps dying on the 7GB runner (~19min
    # burned per attempt). Run workflow_dispatch with build_aab=true to get
    # one when Play publishing becomes real (expect to need memory tuning
    # first, e.g. capped org.gradle.jvmargs).
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.build_aab
    steps:
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true
      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-aab-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/build.gradle', 'android/settings.gradle', 'android/app/build.gradle', 'pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-aab-
      - name: Decode keystore and write key.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/meshnomad-release.keystore
          cat > android/key.properties << EOF
          storeFile=meshnomad-release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
      - run: flutter pub get
      - name: Build release App Bundle
        run: flutter build appbundle --release
      - uses: actions/upload-artifact@v7
        with:
          name: meshnomad-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  android-release-publish:
    runs-on: ubuntu-latest
    # Tag pushes only — a workflow_dispatch build is for grabbing test
    # artifacts, not for creating a GitHub Release. Depends only on the APKs;
    # the AAB job is opt-in (see above) and not part of the release assets.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: android-release-apk
    permissions:
      # The default GITHUB_TOKEN is read-only; creating the GitHub Release
      # (softprops/action-gh-release) needs contents write.
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # git-cliff needs the full history and tags to build release notes;
          # a shallow clone yields an empty changelog.
          fetch-depth: 0
      - uses: actions/download-artifact@v6
        with:
          name: meshnomad-release-apk
          path: build/app/outputs/flutter-apk
      - name: Determine changelog range
        id: range
        run: |
          # Previous v* tag if any; for the very first release fall back to the
          # fork merge-base with upstream (2026-07-28) so upstream history is
          # excluded from the notes.
          PREV=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          if [ -z "$PREV" ]; then
            PREV=98f6cf37455168466b5d973b94c74a8d8b0f624c
          fi
          echo "range=${PREV}..HEAD" >> "$GITHUB_OUTPUT"
          echo "Changelog range: ${PREV}..HEAD"
      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
          args: --strip header ${{ steps.range.outputs.range }}
        env:
          OUTPUT: CHANGES.md
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-*-release.apk
          body: ${{ steps.git-cliff.outputs.content }}

  ios:
    # Temporarily disabled 2026-08-21 to save Actions minutes on the free
    # plan (macos-latest runners bill at a 10x multiplier). Re-enable by
    # removing this `if:` line.
    if: false
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign --no-pub

  linux:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true
      - name: Install Linux build deps
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev
      - run: flutter pub get
      - run: flutter build linux --release --no-pub
      - name: Pack Linux bundle
        run: tar -C build/linux/x64/release -czf meshnomad-linux-x64.tar.gz bundle
      - uses: actions/upload-artifact@v7
        with:
          name: meshnomad-linux-x64
          path: meshnomad-linux-x64.tar.gz
          retention-days: 7

  macos:
    # Temporarily disabled 2026-08-21 to save Actions minutes on the free
    # plan (macos-latest runners bill at a 10x multiplier). Re-enable by
    # removing this `if:` line.
    if: false
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true
      - name: Install macOS build deps
        run: brew install automake libtool
      - run: flutter pub get
      - run: flutter build macos --release --no-pub

  web:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --no-pub
      - uses: actions/upload-artifact@v7
        with:
          name: meshnomad-web
          path: build/web
          retention-days: 7
