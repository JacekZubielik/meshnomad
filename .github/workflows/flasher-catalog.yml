name: flasher-catalog

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Generate catalog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dart tool/generate_flasher_catalog.dart /tmp/catalog.json

      - name: Publish to flasher-catalog branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan flasher-catalog
          git rm -rf --quiet .
          cp /tmp/catalog.json catalog.json
          git add catalog.json
          if git diff --cached --quiet; then
            echo "No changes"; exit 0
          fi
          git commit -m "chore: update flasher catalog"
          git push --force origin flasher-catalog
