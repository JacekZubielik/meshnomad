name: docs

on:
  # No paths filter (2026-08-23, was scoped to mkdocs.yml/docs/**): a
  # version bump with no docs edits (v0.11.0) never registered a new entry
  # in the mike version switcher under the old filter, since it only
  # fired on doc-content changes — the deployed docs stayed pinned to
  # whichever version last touched docs/**. Every push to main AND every
  # release tag now redeploys (mike deploy is ~20s, cheap), so the
  # switcher stays in step with build.yml's release trigger.
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install docs dependencies
        run: pip install -r requirements-docs.txt

      - name: Configure git identity for mike's commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

      - name: Extract version from pubspec.yaml
        id: version
        run: |
          FULL=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//')
          MAJOR_MINOR=$(echo "$FULL" | cut -d. -f1,2)
          echo "value=$MAJOR_MINOR" >> "$GITHUB_OUTPUT"

      - name: Deploy with mike
        run: mike deploy ${{ steps.version.outputs.value }} latest --update-aliases --push
